<div>
  <!-- Header with title -->
  <div class="d-flex align-items-center mb-2">
    <h3 class="filter-label mb-0">Kategorien</h3>
  </div>

  <!-- Main categories with "Alle" button integrated -->
  <div class="main-categories mb-3">
    <div class="row g-2" role="group" aria-label="Nach Kategorie filtern">
      <!-- "Alle" button with same styling as categories -->
      <div class="col-auto">
        <button 
          class="btn category-btn rounded-pill px-3 py-2 fw-medium position-relative"
          [class]="isNothingSelected() ? 'btn-primary shadow-sm' : 'btn-outline-primary'"
          type="button"
          [attr.aria-pressed]="isNothingSelected()"
          (click)="dataState.resetCategory()"
          title="Alle Kategorien anzeigen">
          <span class="category-name fw-semibold">Alle</span>
        </button>
      </div>
      <!-- Category buttons -->
      <div class="col-auto" *ngFor="let category of categoriesCleaned">
        <button 
          class="btn category-btn rounded-pill px-3 py-2 fw-medium position-relative"
          [class]="isSelectedCategory(category) ? 'btn-primary shadow-sm' : 'btn-outline-primary'"
          type="button"
          [attr.aria-pressed]="isSelectedCategory(category)"
          (click)="dataState.filterByCategory(category)"
          [title]="'Filtern nach ' + category.name">
          <span class="category-name fw-semibold">{{category.name}}</span>
          <span class="badge bg-light text-dark ms-2 small rounded-pill" *ngIf="category.total">
            {{ (dataState.showAverage ? category.total / dataState.selectedMonthAmountInDataRangeFilter : category.total) | currency:'EUR':'symbol':'1.0-0' }}
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- Subcategories with Bootstrap styling -->
  <div class="subcategories border-top border-light pt-3 mt-3" *ngIf="selectedSubCategoriesCleaned.length > 0">
    <div class="d-flex align-items-center mb-2">
      <small class="text-muted fw-semibold text-uppercase">
        Unterkategorien:
      </small>
    </div>
    <div class="d-flex flex-wrap gap-2" role="group" aria-label="Nach Unterkategorie filtern">
      <button 
        type="button"
        [attr.aria-pressed]="isSelectedCategory(category)"
        class="btn btn-sm subcategory-btn rounded-pill fw-medium"
        [class]="isSelectedCategory(category) ? 'btn-secondary' : 'btn-outline-secondary'"
        (click)="dataState.filterByCategory(category)" 
        *ngFor="let category of selectedSubCategoriesCleaned"
        [title]="'Filtern nach ' + category.name">
        <span class="subcategory-name">{{category.name}}</span>
        <span class="badge bg-light text-dark ms-1 small rounded-pill" *ngIf="category.total">
          {{ (dataState.showAverage ? category.total / dataState.selectedMonthAmountInDataRangeFilter : category.total) | currency:'EUR':'symbol':'1.0-0' }}
        </span>
      </button>
    </div>
  </div>
</div>
