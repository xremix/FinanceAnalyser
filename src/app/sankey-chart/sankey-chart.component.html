<div class="sankey-chart-container" [style.height]="height">
  @if (chartOptions && chartOptions.series) {
    <div echarts [options]="chartOptions" class="sankey-chart"></div>
  } @else {
    <div class="no-data">
      <i class="bi bi-bar-chart-line"></i>
      <p>Keine Daten verfügbar</p>
    </div>
  }
</div>
