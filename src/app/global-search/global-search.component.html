<div class="input-group mb-3">
  <input 
    type="text" 
    class="form-control" 
    placeholder="Suche in Buchungen... (z.B. 'miete wohnung' oder 'sparkasse -gebühr')"
    [(ngModel)]="searchTerm"
    (input)="onSearchChange()"
    aria-label="Globale Suche"
  >
  <button 
    class="btn btn-outline-secondary" 
    type="button" 
    (click)="clearSearch()"
    [disabled]="!searchTerm"
    title="Suche löschen"
  >
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<div *ngIf="searchTerm" class="text-center mb-3">
  <small class="text-muted">
    <strong>{{dataState.selectedTransactions.length}}</strong> Buchung(en) gefunden
  </small>
  <br>
  <small class="text-info">
    <strong>Tipp:</strong> Mehrere Begriffe werden ODER-verknüpft (z.B. "miete wohnung"). 
    Verwende "-" um Begriffe auszuschließen (z.B. "sparkasse -gebühr")
  </small>
</div>
